# ── H2 In-Memory Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:ticketdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create tables from JPA entities, then run data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# H2 web console (dev only): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────────────────────
# Secret must be ≥256 bits for HS256. Change in production.
app.jwt.secret=ThisIsASecretKeyForDemoOnlyPleaseChangeInProductionOkay
app.jwt.expiration=86400000

# ── Groq API ───────────────────────────────────────────────────────────────────
# Set GROQ_API_KEY environment variable before running.
# Get free key at: https://console.groq.com
groq.api.key=${GROQ_API_KEY:REPLACE_WITH_YOUR_GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.demo=DEBUG
