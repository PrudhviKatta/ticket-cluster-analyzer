# ── H2 In-Memory Database ──────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:ticketdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# create tables from JPA entities, then run data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# H2 web console (dev only): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JWT ────────────────────────────────────────────────────────────────────────
# Secret must be ≥256 bits for HS256. Change in production.
app.jwt.secret=ThisIsASecretKeyForDemoOnlyPleaseChangeInProductionOkay
app.jwt.expiration=86400000

# ── Groq API ───────────────────────────────────────────────────────────────────
# Set GROQ_API_KEY environment variable before running.
# Get free key at: https://console.groq.com
groq.api.key=${GROQ_API_KEY:REPLACE_WITH_YOUR_GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# ── CORS ───────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ── Jackson ────────────────────────────────────────────────────────────────────
# Serialize LocalDateTime as ISO-8601 string, not array
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Circuit Breaker (Resilience4j) ─────────────────────────────────────────────
# Open circuit after 50% failure rate over last 5 calls (min 3 calls)
resilience4j.circuitbreaker.instances.groqApi.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.groqApi.sliding-window-size=5
resilience4j.circuitbreaker.instances.groqApi.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.groqApi.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.groqApi.permitted-number-of-calls-in-half-open-state=1

# ── Async Thread Pool ──────────────────────────────────────────────────────────
app.async.core-pool-size=2
app.async.max-pool-size=5
app.async.queue-capacity=10

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.demo=DEBUG
logging.level.io.github.resilience4j=INFO
